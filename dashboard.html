<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gig Radar (local)</title>
<style>
:root{--bg:#0c1118;--surface:#141b26;--s2:#1b2432;--line:#273244;--fg:#eef2f8;--muted:#9aa7bb;--faint:#6b7892;--accent:#2bd48a;--accentw:#123326;--accentfg:#9fecc8;--new:#f0a94b;--neww:#38280f;--danger:#ff6b5e;--info:#6aa3ff;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 Inter,system-ui,-apple-system,sans-serif}
a{color:var(--info);text-decoration:none}a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
h1{font:600 18px/1 'Space Grotesk',Inter,sans-serif;margin:0;letter-spacing:-.02em}
.sub{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.sp{margin-left:auto}
button{font:inherit;cursor:pointer;background:var(--s2);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-weight:600}
button.p{background:var(--accent);color:#042a1b;border-color:var(--accent)}
.meta{width:100%;font-size:11.5px;color:var(--faint);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.src{font-size:10.5px;padding:2px 7px;border-radius:20px;border:1px solid var(--line);color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.src i{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.src.ok i{background:var(--accent)}.src.bad i{background:var(--danger)}
.wrap{max-width:1240px;margin:0 auto;padding:16px 18px 50px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:180px;display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.search input{border:none;background:none;color:var(--fg);width:100%;outline:none;font-size:14px}
.toggle{font-size:12.5px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:12px;font-weight:600;padding:5px 10px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.chip[aria-pressed=true]{background:var(--accentw);border-color:var(--accent);color:var(--accentfg)}
.count{font-size:12.5px;color:var(--faint);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.new{border-color:var(--new)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card h3{font:600 15px/1.3 Inter;margin:0}.card h3 a{color:var(--fg)}
.bnew{font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--new);background:var(--neww);padding:2px 6px;border-radius:5px;text-transform:uppercase;white-space:nowrap}
.dom{align-self:flex-start;font-size:11px;font-weight:700;color:var(--accentfg);background:var(--accentw);padding:3px 8px;border-radius:6px}
.co{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.desc{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.facts{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--faint);margin-top:auto}
.facts b{color:var(--accent)}
.tags{display:flex;gap:5px;flex-wrap:wrap}.tg{font-size:10.5px;color:var(--faint);background:var(--s2);padding:2px 7px;border-radius:5px}
.apply{text-align:center;background:var(--accent);color:#042a1b;font-weight:700;font-size:12.5px;padding:7px;border-radius:8px}
.empty{color:var(--faint);text-align:center;padding:50px}
.tabs{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:4}
.tab{background:none;border:none;padding:12px 14px;font:600 13.5px/1 Inter;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.tab[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
.lead{font-size:13.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.legend{font-size:11px;color:var(--faint);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pcat h2{font:600 14.5px/1 'Space Grotesk',Inter;margin:12px 0 10px;color:var(--fg);padding-bottom:6px;border-bottom:1px solid var(--line)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pcard .ph{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pcard h3{font:600 14.5px/1.2 Inter;margin:0}.pcard h3 a{color:var(--fg)}
.pcard .diff{font-size:10px;font-weight:700;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;color:var(--muted)}
.pcard .diff i{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--faint)}
.pcard .pw{font-size:12.5px;color:var(--muted)}
.pcard .pay{font-size:11.5px;color:var(--accent);font-weight:600;margin-top:auto}
.reqs{display:flex;gap:5px;flex-wrap:wrap}
.req{font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--s2);color:var(--muted);border:1px solid var(--line)}
.req.ok{background:var(--accentw);color:var(--accentfg);border-color:transparent}
.req.bad{background:var(--neww);color:var(--new);border-color:transparent}
.req.stop{color:var(--danger);border-color:var(--danger);background:transparent}
</style>
</head>
<body>
<header>
  <div><h1>Gig Radar <span style="color:var(--accent)">·local</span></h1><div class="sub">Auth feeds + email/SMS alerts</div></div>
  <div class="sp"></div>
  <button class="p" id="refresh">↻ Refresh now</button>
  <div class="meta" id="meta">Loading…</div>
</header>
<div class="tabs">
  <button class="tab" id="tf" aria-selected="true">Live feed</button>
  <button class="tab" id="tp" aria-selected="false">Platforms</button>
</div>
<div class="wrap" id="feedView">
  <div class="bar">
    <label class="search"><span>🔍</span><input id="q" type="search" placeholder="Search title, company, skill…"></label>
    <label class="toggle"><input type="checkbox" id="newOnly"> New only</label>
  </div>
  <div class="chips" id="chips"></div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>No gigs match.</div>
</div>
<div class="wrap" id="plView" hidden>
  <div class="lead">All the sites to apply on. Most need only a free account — chips say what's required. <b>You're in India:</b> flip the toggle to hide platforms that lock India out. These are checked manually; the Live feed is auto-pulled.</div>
  <div class="bar">
    <label class="search" style="max-width:340px"><span>🔍</span><input id="plq" type="search" placeholder="Search platforms…"></label>
    <label class="toggle"><input type="checkbox" id="plIndia"> Hide platforms not open to India</label>
  </div>
  <div class="legend" id="plLegend"></div>
  <div id="plCats"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const LABELS={ai:'AI / Chatbot',write:'Writing',code:'Coding',data:'Data / Research',seo:'SEO',deck:'Slides',trans:'Translation',sheet:'Spreadsheet',market:'Marketing',admin:'Resume / Admin',other:'Misc · try with Claude'};
let ALL=[]; const f={q:'',dom:new Set(),newOnly:false};
function ago(ms){if(!ms)return'';const d=Date.now()-ms,h=36e5,day=864e5;if(d<h)return Math.max(1,Math.round(d/6e4))+'m ago';if(d<day)return Math.round(d/h)+'h ago';return Math.round(d/day)+'d ago';}
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
async function load(){
  try{
    const [jobs,src]=await Promise.all([fetch('/api/jobs').then(r=>r.json()),fetch('/api/sources').then(r=>r.json())]);
    ALL=jobs; renderMeta(src); chips(); render();
  }catch(e){ $('#meta').textContent='Backend not reachable — is server.py running?'; }
}
function renderMeta(src){
  const m=$('#meta'); m.innerHTML='';
  const n=ALL.filter(j=>j.isNew).length;
  m.append(ALL.length+' gigs · '+n+' new · email '+(src.email?'on':'off')+' · sms '+(src.sms?'on':'off')+'  ');
  Object.entries(src.status||{}).forEach(([k,v])=>{
    const c=el('span','src '+(v.state==='ok'?'ok':v.state==='bad'?'bad':''));
    c.append(el('i'),el('span',null,k+(v.n!=null&&v.state==='ok'?' '+v.n:v.state==='bad'?' ×':'')));
    if(v.err)c.title=v.err; m.appendChild(c);
  });
  document.title=(n?'('+n+') ':'')+'Gig Radar (local)';
}
function chips(){
  const cc={}; ALL.forEach(j=>cc[j.dom]=(cc[j.dom]||0)+1);
  const el2=$('#chips'); el2.innerHTML='';
  Object.keys(LABELS).forEach(k=>{ if(!cc[k])return;
    const b=el('button','chip'); b.setAttribute('aria-pressed',f.dom.has(k)); b.textContent=LABELS[k]+' '+cc[k];
    b.onclick=()=>{f.dom.has(k)?f.dom.delete(k):f.dom.add(k);b.setAttribute('aria-pressed',f.dom.has(k));render();};
    el2.appendChild(b); });
}
function match(j){
  if(f.newOnly&&!j.isNew)return false;
  if(f.dom.size&&!f.dom.has(j.dom))return false;
  if(f.q){const h=(j.title+' '+j.company+' '+(j.tags||[]).join(' ')+' '+j.desc).toLowerCase();if(!h.includes(f.q))return false;}
  return true;
}
function render(){
  const g=$('#grid'); g.innerHTML=''; const list=ALL.filter(match);
  $('#count').textContent=list.length+' gigs · newest first';
  $('#empty').hidden=list.length>0;
  const fr=document.createDocumentFragment();
  list.slice(0,300).forEach(j=>{
    const c=el('div','card'+(j.isNew?' new':''));
    const top=el('div','top'); const h=el('h3'); const a=el('a',null,j.title); a.href=j.url; a.target='_blank'; a.rel='noopener'; h.appendChild(a); top.appendChild(h);
    if(j.isNew)top.appendChild(el('span','bnew','New')); c.appendChild(top);
    c.appendChild(el('span','dom','◆ '+(LABELS[j.dom]||'Other')));
    c.appendChild(el('div','co',(j.company||'—')+(j.loc?(' · '+j.loc):'')));
    if(j.desc)c.appendChild(el('div','desc',j.desc));
    if(j.tags&&j.tags.length){const tg=el('div','tags');j.tags.slice(0,5).forEach(t=>tg.appendChild(el('span','tg',String(t).slice(0,22))));c.appendChild(tg);}
    const fa=el('div','facts');
    if(j.salary){const s=el('span');s.append('💰 ');s.appendChild(el('b',null,j.salary));fa.appendChild(s);}
    fa.appendChild(el('span',null,'⏱ '+(ago(j.date)||'recent')));
    fa.appendChild(el('span',null,'via '+j.src)); c.appendChild(fa);
    const ap=el('a','apply','Apply / view →'); ap.href=j.url; ap.target='_blank'; ap.rel='noopener'; c.appendChild(ap);
    fr.appendChild(c);
  });
  g.appendChild(fr);
}
/* ---- Platforms directory ---- */
const CATS=[['market','Freelance marketplaces — bid or sell, account needed'],['ai','AI training & data — apply + screening; you may NOT use AI on the task itself'],['micro','Microtask sites — tiny jobs, fast signup'],['write','Writing & content marketplaces'],['trans','Transcription & captioning'],['sell','Sell digital products — no client, make once, earn repeatedly'],['board','Remote job boards — account to apply']];
const REQ={account:['Account',''],free:['Free to join','ok'],test:['Skill test',''],screening:['Application/screening',''],'connects$':['Paid bids/credits','stop'],'subscription$':['Paid subscription','stop'],KYC:['ID/KYC',''],noAI:['No AI on tasks','bad'],india:['India OK','ok'],usuk:['US/UK only — not India','stop'],verifygeo:['Check your country','bad'],portfolio:['Portfolio helps','']};
const DIFF={easy:['Easy start','var(--accent)'],med:['Medium','var(--info)'],hard:['Hard / slow','var(--danger)']};
const PLATFORMS=[
 {c:'market',n:'Fiverr',u:'https://www.fiverr.com',w:'Package a service as a "gig". India OK. New sellers rank low — niche keyword + fast replies.',r:['account','free','india'],p:'You set price; 20% fee',d:'easy'},
 {c:'market',n:'Upwork',u:'https://www.upwork.com',w:'Bid on client jobs. Biggest pool. Approval tightened 2026; bids cost Connects.',r:['account','connects$','KYC','india','portfolio'],p:'Hourly/fixed; 10% fee',d:'med'},
 {c:'market',n:'Contra',u:'https://contra.com',w:'0% freelancer commission. Smaller pool; great free portfolio home.',r:['account','free','india'],p:'0% to you',d:'easy'},
 {c:'market',n:'Truelancer',u:'https://www.truelancer.com',w:'India-founded; small gigs in writing, data, design, dev. Lower competition.',r:['account','free','india'],p:'Fixed/hourly; fee',d:'easy'},
 {c:'market',n:'PeoplePerHour',u:'https://www.peopleperhour.com',w:'UK-centric; Offers + proposals. Profile is approval-gated.',r:['account','screening','portfolio','verifygeo'],p:'Fixed/hourly; fee',d:'med'},
 {c:'market',n:'Guru',u:'https://www.guru.com',w:'Job board + workrooms; free tier = limited bids.',r:['account','free','india'],p:'Fixed/hourly; fee',d:'med'},
 {c:'market',n:'Freelancer.com',u:'https://www.freelancer.com',w:'Huge low-end marketplace + contests. Bids limited/paid. Noisy.',r:['account','connects$','india'],p:'Fixed/hourly; fee',d:'med'},
 {c:'market',n:'Workana',u:'https://www.workana.com',w:'Marketplace (LatAm-strong, global). Confirm India payout.',r:['account','free','verifygeo'],p:'Fixed/hourly; fee',d:'med'},
 {c:'ai',n:'Outlier',u:'https://outlier.ai',w:'RLHF, writing & coding eval. India accepted, PayPal weekly. Coding pays most.',r:['account','screening','test','noAI','india'],p:'$14–50/hr; PayPal',d:'med'},
 {c:'ai',n:'Mercor',u:'https://mercor.com',w:'AI-trainer + expert gigs by interview. India present.',r:['account','screening','noAI','india'],p:'$10–100/hr; Stripe/Wise',d:'med'},
 {c:'ai',n:'Turing',u:'https://www.turing.com',w:'For developers: coding-data + remote dev roles. Coding tests. Strong India.',r:['account','screening','test','india'],p:'$ by skill; Payoneer',d:'hard'},
 {c:'ai',n:'Mindrift',u:'https://www.mindrift.ai',w:'Freelance AI-training projects (writing, code, domain). Apply + screening.',r:['account','screening','noAI','verifygeo'],p:'Per-project; verify',d:'med'},
 {c:'ai',n:'Remotasks',u:'https://www.remotasks.com',w:'Annotation + AI tasks, 90+ countries. PayPal/AirTM. No AI on the task.',r:['account','screening','noAI','verifygeo'],p:'Per task; PayPal/AirTM',d:'med'},
 {c:'ai',n:'TELUS International AI',u:'https://www.telusinternational.com/careers/ai-community',w:'Search/ads/data rater + annotation (ex-Lionbridge). India varies by project.',r:['account','screening','verifygeo'],p:'Hourly; varies',d:'med'},
 {c:'ai',n:'Prolific',u:'https://www.prolific.com',w:'Paid research studies (not annotation). Cash out ~$6 PayPal. Confirm India.',r:['account','free','verifygeo'],p:'Per study; PayPal',d:'easy'},
 {c:'ai',n:'Appen',u:'https://www.appen.com',w:'Crowd AI-data (search eval, transcription, collection). Queues often empty.',r:['account','screening','verifygeo'],p:'Hourly/task; PayPal',d:'med'},
 {c:'ai',n:'DataAnnotation',u:'https://www.dataannotation.tech',w:'Top-paying LLM work — BUT US/UK/CA/IE/AU/NZ only. Not open to India.',r:['account','test','noAI','usuk'],p:'$20–150/hr; PayPal',d:'med'},
 {c:'micro',n:'Clickworker',u:'https://www.clickworker.com',w:'Short jobs: research, writing, data, AI micro-tasks. India OK; assessments unlock work.',r:['account','test','india'],p:'Per task; PayPal/SEPA',d:'easy'},
 {c:'micro',n:'Microworkers',u:'https://www.microworkers.com',w:'HIT-style micro-jobs. India OK; withdraw at threshold.',r:['account','india'],p:'Per task; low',d:'easy'},
 {c:'micro',n:'Toloka',u:'https://toloka.ai',w:'Crowd + expert AI-data; shifting to vetted experts. Confirm country.',r:['account','screening','verifygeo'],p:'Per task; verify',d:'med'},
 {c:'micro',n:'OneForma',u:'https://www.oneforma.com',w:'Crowd data: transcription, categorization, collection, AI eval. Apply per project.',r:['account','screening','verifygeo'],p:'Per project; varies',d:'med'},
 {c:'micro',n:'Amazon MTurk',u:'https://www.mturk.com',w:'Classic micro-task market. Worker approval + India payout limited — check.',r:['account','screening','verifygeo'],p:'Per HIT; low',d:'hard'},
 {c:'write',n:'iWriter',u:'https://www.iwriter.com',w:'Content mill; pass a sample, claim orders. Pay rises with rating.',r:['account','test','verifygeo'],p:'$ per article by tier',d:'easy'},
 {c:'write',n:'Crowd Content',u:'https://www.crowdcontent.com',w:'Writing marketplace; graded onboarding, per-word by level.',r:['account','test','verifygeo'],p:'$0.02–0.08/word',d:'med'},
 {c:'write',n:'nDash',u:'https://www.ndash.com',w:'Higher-end content; free profile + Stripe, pitch brand briefs.',r:['account','free','portfolio','verifygeo'],p:'$ per piece; Stripe',d:'med'},
 {c:'write',n:'Constant Content',u:'https://www.constant-content.com',w:'Write on spec and sell from a catalog. Passive once listed.',r:['account','verifygeo'],p:'You price; sells on demand',d:'med'},
 {c:'write',n:'Textbroker',u:'https://www.textbroker.com',w:'Big content mill — author accounts region-restricted (US/select). Check first.',r:['account','test','usuk'],p:'$ per word by rating',d:'easy'},
 {c:'trans',n:'GoTranscript',u:'https://www.gotranscript.com',w:'Transcription + captions; free test, many languages, global incl. India.',r:['account','test','india'],p:'$0.65–1.75/audio-min',d:'easy'},
 {c:'trans',n:'TranscribeMe',u:'https://www.transcribeme.com',w:'Short audio clips, flexible, global. Short test. PayPal.',r:['account','test','india'],p:'~$15–22/audio-hr; PayPal',d:'easy'},
 {c:'trans',n:'Scribie',u:'https://scribie.com',w:'Transcription from short files; free test, globally open. PayPal.',r:['account','test','india'],p:'~$5–20/audio-hr; PayPal',d:'easy'},
 {c:'trans',n:'Rev',u:'https://www.rev.com/freelancers',w:'Transcription + captions, weekly PayPal — but signup US-restricted lately.',r:['account','test','usuk'],p:'$0.30–1.10/audio-min',d:'easy'},
 {c:'trans',n:'3Play Media',u:'https://www.3playmedia.com',w:'Captioning/subtitling; pays above general transcription. Region-limited.',r:['account','test','usuk'],p:'$ per media-min',d:'med'},
 {c:'sell',n:'PromptBase',u:'https://promptbase.com',w:'Sell tested prompt packs — no client. Build + stress-test with Claude. India OK.',r:['account','free','india'],p:'You price (~$5); 20% cut',d:'easy'},
 {c:'sell',n:'Gumroad',u:'https://gumroad.com',w:'Sell any digital product from your own link. India payouts supported.',r:['account','KYC','india'],p:'You price; 10%+$0.50',d:'easy'},
 {c:'sell',n:'Etsy',u:'https://www.etsy.com/sell',w:'Sell digital templates/printables. Must disclose AI items; add human value.',r:['account','KYC','subscription$','india'],p:'You price; listing+6.5%',d:'med'},
 {c:'sell',n:'Payhip',u:'https://payhip.com',w:'Free storefront for digital downloads. Simple, India-friendly.',r:['account','free','india'],p:'You price; free tier 5%',d:'easy'},
 {c:'sell',n:'Creative Fabrica',u:'https://www.creativefabrica.com',w:'Marketplace with growing AI-prompt + design category. Apply to sell.',r:['account','screening','verifygeo'],p:'You price; cut',d:'med'},
 {c:'board',n:'Internshala',u:'https://internshala.com',w:'India-first: part-time internships + fresher gigs (writing, content, data, dev).',r:['account','free','india'],p:'Stipend/fixed; INR',d:'easy'},
 {c:'board',n:'Wellfound',u:'https://wellfound.com',w:'Startup jobs incl. remote/part-time + contract. Free profile, apply to founders.',r:['account','free','portfolio','india'],p:'Role salary/contract',d:'med'},
 {c:'board',n:'FlexJobs',u:'https://www.flexjobs.com',w:'Hand-screened remote/part-time listings — access needs a paid subscription.',r:['account','subscription$','india'],p:'Role pay; curated',d:'med'}
];
const pf={q:'',hideNonIndia:false};
function renderLegend(){const e=$('#plLegend');if(e.childElementCount)return;[['ok','India OK / free'],['bad','Check country / no-AI rule'],['stop','Paid or region-locked']].forEach(([cls,txt])=>{const s=el('span');s.append(el('span','req '+cls,'■'),el('span',null,' '+txt));e.appendChild(s);});}
function plKeep(p){if(pf.hideNonIndia&&p.r.includes('usuk'))return false;if(pf.q){const h=(p.n+' '+p.w+' '+p.r.join(' ')).toLowerCase();if(!h.includes(pf.q))return false;}return true;}
function renderPlatforms(){renderLegend();const wrap=$('#plCats');wrap.innerHTML='';
 CATS.forEach(([key,label])=>{const list=PLATFORMS.filter(p=>p.c===key&&plKeep(p));if(!list.length)return;
  const sec=el('div','pcat');sec.appendChild(el('h2',null,label));const g=el('div','pgrid');
  list.forEach(p=>{const c=el('div','pcard');const ph=el('div','ph');const h=el('h3');const a=el('a',null,p.n);a.href=p.u;a.target='_blank';a.rel='noopener';h.appendChild(a);ph.appendChild(h);
   const df=el('span','diff');const di=el('i');di.style.background=DIFF[p.d][1];df.append(di,DIFF[p.d][0]);ph.appendChild(df);c.appendChild(ph);
   c.appendChild(el('div','pw',p.w));const rq=el('div','reqs');p.r.forEach(k=>{const m=REQ[k];if(m)rq.appendChild(el('span','req '+(m[1]||''),m[0]));});c.appendChild(rq);
   c.appendChild(el('div','pay','💵 '+p.p));g.appendChild(c);});
  sec.appendChild(g);wrap.appendChild(sec);});
 if(!wrap.childElementCount)wrap.appendChild(el('div','empty','No platforms match.'));}
function selTab(which){const feed=which==='feed';$('#tf').setAttribute('aria-selected',feed);$('#tp').setAttribute('aria-selected',!feed);$('#feedView').hidden=!feed;$('#plView').hidden=feed;if(!feed)renderPlatforms();window.scrollTo(0,0);}
$('#tf').addEventListener('click',()=>selTab('feed'));
$('#tp').addEventListener('click',()=>selTab('platforms'));
$('#plq').addEventListener('input',e=>{pf.q=e.target.value.trim().toLowerCase();renderPlatforms();});
$('#plIndia').addEventListener('change',e=>{pf.hideNonIndia=e.target.checked;renderPlatforms();});
$('#q').addEventListener('input',e=>{f.q=e.target.value.trim().toLowerCase();render();});
$('#newOnly').addEventListener('change',e=>{f.newOnly=e.target.checked;render();});
$('#refresh').addEventListener('click',async()=>{const b=$('#refresh');b.disabled=true;b.textContent='↻ …';try{await fetch('/api/refresh',{method:'POST'});}catch(e){}await load();b.disabled=false;b.textContent='↻ Refresh now';});
load(); setInterval(load,60000);
</script>
